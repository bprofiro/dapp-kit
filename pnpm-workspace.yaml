# pnpm settings for a project that talks to wallets.
# Recent npm supply-chain attacks specifically targeted crypto frontends.

# Don't install versions published less than 24h ago (gives a malicious
# release time to be detected and pulled). Requires pnpm >= 10.16.
minimumReleaseAge: 1440

# Install scripts (postinstall, etc.) are blocked by default in pnpm 10.
# Only allow what you have reviewed.
onlyBuiltDependencies: []
